url: http://animovement.dev/aniread/
home:
  title: "aniread – An R package for reading and writing movement data"

authors:
  - name: "Mikkel Roald‑Arbøl"
    href: "https://roald-arboel.com"

template:
  bootstrap: 5
  light-switch: true

navbar:
  structure:
    left:
      - intro
      - reference
      - news
    right:
      - search
      - github
      - zulip
      - lightswitch
  components:
    zulip:
      icon: fa-comments
      href: https://animovement.zulipchat.com
      aria-label: Chat on Zulip

reference:
- title: "Reader functions"
  desc: These functions are the links between R and your movement data.
  contents:
  - read_aniframe
  - read_animalta
  - read_anipose
  - read_bonsai
  - read_c3d
  - read_custom
  - read_deeplabcut
  - read_fasttrack
  - read_fictrac
  - read_freemocap
  - read_idtracker
  - read_lightningpose
  - read_movement
  - read_octron
  - read_sleap
  - read_trackball
  - read_trackmate
  - read_trex

- title: "Event-data readers"
  desc: >
    Readers for behavioural-event data — these import into an
    `aniframe::anievent()`.
  contents:
  - read_boris

- title: "Writer functions"
  desc: These functions are allow you to save your data.
  contents:
  - write_aniframe
  - write_intracktive

- title: Miscellaneous
  contents:
  - get_sample_data
  - calibrate_trackball
